apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/customer1/
patches:
  - target:
      kind: SecretProviderClass
      name: customer1-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/userAssignedIdentityID
        value: "a56b390d-59ef-4e98-91c3-8220d019e9d2"
      - op: replace
        path: /spec/parameters/tenantId
        value: "480dcc85-c1a6-45ad-b7f9-d4b3e55c16f4"
  - target:
      kind: ObjectStore
      name: customer1-objectstore
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: "https://d11smercurybakstaging.blob.core.windows.net/customer1"
  - target:
      kind: Ingress
      name: customer1-ingress
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "customer1.mercury-staging.d11s.space"
      - op: replace
        path: /spec/rules/0/host
        value: "customer1.mercury-staging.d11s.space"
