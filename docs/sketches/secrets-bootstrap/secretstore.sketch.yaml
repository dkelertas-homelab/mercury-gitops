# SKETCH — Azure Key Vault SecretStore for customer1.
# Prefer Workload Identity (ESO SA federated to UAMI) over raw client secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: customer1-keyvault
  namespace: customer1
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://d11s-kv-mercury-staging.vault.azure.net
      # serviceAccountRef / identity id — fill when enabling
      # tenantId: "480dcc85-c1a6-45ad-b7f9-d4b3e55c16f4"
