# SKETCH — creates K8s Secrets before CNPG Cluster / n8n need them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer1-db-credentials
  namespace: customer1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: customer1-keyvault
    kind: SecretStore
  target:
    name: customer1-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: customer1-db-user
    - secretKey: password
      remoteRef:
        key: customer1-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer1-n8n-env
  namespace: customer1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: customer1-keyvault
    kind: SecretStore
  target:
    name: customer1-n8n-env
    creationPolicy: Owner
  data:
    - secretKey: DB_POSTGRESDB_USER
      remoteRef:
        key: customer1-db-user
    - secretKey: DB_POSTGRESDB_PASSWORD
      remoteRef:
        key: customer1-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer1-backup-creds
  namespace: customer1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: customer1-keyvault
    kind: SecretStore
  target:
    name: customer1-backup-creds
    creationPolicy: Owner
  data:
    - secretKey: storage-account-name
      remoteRef:
        key: storage-account-name
    - secretKey: customer1-blob-sas
      remoteRef:
        key: customer1-blob-sas
