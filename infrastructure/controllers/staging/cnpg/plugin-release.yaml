apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 30m
  # Wait for cert-manager webhook/CRDs and CNPG operator before installing
  # Certificates/TLS secrets the chart creates (avoids the fresh-cluster race).
  dependsOn:
    - name: cert-manager
    - name: cnpg
  targetNamespace: cnpg-system
  releaseName: cnpg-plugin-barman-cloud
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
