# PR validation for the GitOps repo.
# ADO equivalent: a build-validation pipeline wired into branch policies.
name: Validate

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YAMLLINT_VERSION: "1.38.0"
  KUSTOMIZE_VERSION: "5.8.2"
  KUBECONFORM_VERSION: "0.8.0"
  # matches the AKS minor version in mercury-workflows (1.34.x)
  K8S_VERSION: "1.34.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pipx install "yamllint==${YAMLLINT_VERSION}"

      - name: Lint all YAML
        # --format github turns findings into inline PR annotations
        run: yamllint --strict --format github .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history, so a secret committed then deleted is still caught
          fetch-depth: 0

      - uses: ./.github/actions/setup-tools
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}

      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --no-banner .

  discover:
    name: discover overlays
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.find.outputs.overlays }}
    steps:
      - uses: actions/checkout@v7

      - name: Find Flux entrypoints (*/staging, */production)
        id: find
        run: |
          overlays=$(scripts/list-overlays.sh --json)
          echo "$overlays" | jq .
          echo "overlays=$overlays" >> "$GITHUB_OUTPUT"

  manifests:
    name: build + validate (${{ matrix.overlay.path }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: ${{ fromJSON(needs.discover.outputs.overlays) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}
          kubeconform-version: ${{ env.KUBECONFORM_VERSION }}

      - name: kustomize build + kubeconform
        env:
          OVERLAY: ${{ matrix.overlay.path }}
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: |
          mkdir -p "$KUBECONFORM_CACHE"
          scripts/validate.sh "$OVERLAY"
