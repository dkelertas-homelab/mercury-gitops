# PR validation for the GitOps repo.
# ADO equivalent: a build-validation pipeline wired into branch policies.
name: Validate

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YAMLLINT_VERSION: "1.38.0"
  KUSTOMIZE_VERSION: "5.8.2"
  KUBECONFORM_VERSION: "0.8.0"
  # matches the AKS minor version in mercury-workflows (1.34.x)
  K8S_VERSION: "1.34.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pipx install "yamllint==${YAMLLINT_VERSION}"

      - name: Lint all YAML
        # --format github turns findings into inline PR annotations
        run: yamllint --strict --format github .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint scripts
        # shellcheck is preinstalled on GitHub-hosted Ubuntu runners
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history, so a secret committed then deleted is still caught
          fetch-depth: 0

      - uses: ./.github/actions/setup-tools
        with:
          gitleaks-version: ${{ env.GITLEAKS_VERSION }}

      - name: Scan git history for secrets
        run: gitleaks git --redact --verbose --no-banner .

  discover:
    name: discover overlays
    runs-on: ubuntu-latest
    outputs:
      overlays: ${{ steps.find.outputs.overlays }}
      envs: ${{ steps.find.outputs.envs }}
    steps:
      - uses: actions/checkout@v7

      - name: Find Flux entrypoints (*/staging, */production)
        id: find
        run: |
          overlays=$(scripts/list-overlays.sh --json)
          echo "$overlays" | jq .
          echo "overlays=$overlays" >> "$GITHUB_OUTPUT"
          echo "envs=$(scripts/list-overlays.sh --envs)" >> "$GITHUB_OUTPUT"

  manifests:
    name: build + validate (${{ matrix.overlay.path }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: ${{ fromJSON(needs.discover.outputs.overlays) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}
          kubeconform-version: ${{ env.KUBECONFORM_VERSION }}

      - name: kustomize build + kubeconform
        env:
          OVERLAY: ${{ matrix.overlay.path }}
          KUBECONFORM_CACHE: ${{ runner.temp }}/kubeconform-cache
        run: |
          mkdir -p "$KUBECONFORM_CACHE"
          scripts/validate.sh "$OVERLAY"

  # "Build" stage: render each environment's manifests and publish them as an
  # artifact (what Flux will apply, plus an index of images/charts/hosts).
  render:
    name: render (${{ matrix.env }})
    needs: [discover, manifests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJSON(needs.discover.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Render manifests
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          yq --version   # preinstalled on GitHub-hosted Ubuntu runners
          scripts/render.sh "$ENV_NAME"
          cat "rendered/${ENV_NAME}/index.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish rendered manifests
        uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ matrix.env }}-${{ github.sha }}
          path: rendered/${{ matrix.env }}/
          retention-days: 30
          if-no-files-found: error

  # Single required check for branch protection, so matrix legs can come and
  # go without editing the protection rule.
  result:
    name: validate
    if: always()
    needs: [yamllint, shellcheck, gitleaks, discover, manifests, render]
    runs-on: ubuntu-latest
    steps:
      - name: All validation jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<< "$RESULTS"
